name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node.js ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: univer
          POSTGRES_PASSWORD: univer
          POSTGRES_DB: collaboration
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U univer"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      UNIVER_COLLAB_POSTGRES_URL: postgres://univer:univer@localhost:5432/collaboration

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check
        run: pnpm check

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test
